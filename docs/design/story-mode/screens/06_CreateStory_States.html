<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しい物語｜状態一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F8F9FD;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#26232B;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
a{color:#D6456A}a:hover{color:#B8324F}
</style>
</helmet>
<div style="width: 393px; height: 980px; background: #F8F9FD; box-sizing: border-box; padding: 24px 0 32px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="padding: 0 20px; font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">ボトムバー｜有効</span>
<div style="padding: 12px 20px 34px; background: rgba(255,255,255,0.84); border-top: 0.5px solid #ECE6EF; border-bottom: 0.5px solid #ECE6EF">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 18px; background: linear-gradient(90deg, #FF758C, #FF7EB3); box-shadow: 0 8px 20px rgba(255,117,140,0.32); color: #FFFFFF; font-size: 17px; font-weight: 700; letter-spacing: 0.02em">物語を保存して始める</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="padding: 0 20px; font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">ボトムバー｜無効（推し未選択）</span>
<div style="padding: 12px 20px 34px; background: rgba(255,255,255,0.84); border-top: 0.5px solid #ECE6EF; border-bottom: 0.5px solid #ECE6EF; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6E6578">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#6E6578" aria-hidden="true"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1 5v7h2V7zm0 9v2h2v-2z"></path></svg>推しを1人以上選んでください
</div>
<button type="button" disabled="" style="width: 100%; height: 56px; border: 0; border-radius: 18px; background: #ECE6EF; color: #A69DB0; font-size: 17px; font-weight: 700; letter-spacing: 0.02em">物語を保存して始める</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="padding: 0 20px; font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">ボトムバー｜無効（入力エラー）</span>
<div style="padding: 12px 20px 34px; background: rgba(255,255,255,0.84); border-top: 0.5px solid #ECE6EF; border-bottom: 0.5px solid #ECE6EF; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #D93A55">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#D93A55" aria-hidden="true"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1 5v7h2V7zm0 9v2h2v-2z"></path></svg>タイトルを入力してください
</div>
<button type="button" disabled="" style="width: 100%; height: 56px; border: 0; border-radius: 18px; background: #ECE6EF; color: #A69DB0; font-size: 17px; font-weight: 700; letter-spacing: 0.02em">物語を保存して始める</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
<span style="font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">入力欄｜エラー</span>
<div style="background: #FFFFFF; border: 1px solid #ECE6EF; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px">
<label for="errTitle" style="font-size: 15px; font-weight: 600">タイトル</label>
<span style="font-size: 12px; font-weight: 600; color: #D6456A">必須</span>
</div>
<input id="errTitle" type="text" placeholder="例：放課後、秘密の作戦会議" style="height: 52px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #D93A55; background: #FFF7F8; font-size: 16px">
<div style="display: flex; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #D93A55"><svg width="14" height="14" viewBox="0 0 24 24" fill="#D93A55" aria-hidden="true"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1 5v7h2V7zm0 9v2h2v-2z"></path></svg>タイトルを入力してください</span>
<span style="font-size: 12px; color: #8C8497">0 / 30</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
<span style="font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">推しグリッド｜3人選択済み（他は選択不可）</span>
<div style="background: #FFFFFF; border: 1px solid #ECE6EF; border-radius: 22px; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" style="padding: 14px 6px 12px; border-radius: 18px; border: 1.5px solid #FFB8C9; background: #FFF7FA; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="position: relative; width: 56px; height: 56px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: linear-gradient(135deg, #FF758C, #FF7EB3)"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; background: #FFE3EC"></span><span style="position: absolute; right: -5px; top: -5px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #FFFFFF; background: linear-gradient(135deg, #FF758C, #FF7EB3); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span></span>
<span style="font-size: 15px; font-weight: 600">ミオ</span>
</button>
<button type="button" disabled="" style="padding: 14px 6px 12px; border-radius: 18px; border: 1px solid #ECE6EF; background: #FFFFFF; opacity: 0.45; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 56px; height: 56px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: #F2EDF4"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; background: #FFF1E0"></span></span>
<span style="font-size: 15px; font-weight: 600">レイ</span>
</button>
<button type="button" disabled="" style="padding: 14px 6px 12px; border-radius: 18px; border: 1px solid #ECE6EF; background: #FFFFFF; opacity: 0.45; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 56px; height: 56px; border-radius: 50%; padding: 3px; box-sizing: border-box; background: #F2EDF4"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; background: #F3E8F7"></span></span>
<span style="font-size: 15px; font-weight: 600">ユナ</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
<span style="font-size: 13px; font-weight: 700; color: #8C8497; letter-spacing: 0.04em">Disclosure｜閉じた状態（初期表示）</span>
<button type="button" aria-expanded="false" style="width: 100%; min-height: 72px; padding: 14px 16px; box-sizing: border-box; border: 1px solid #ECE6EF; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F5F0FF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E77C7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">配役・推し同士の関係を変更</span>
<span style="font-size: 13px; color: #8C8497">変更しなくても、初期値のまま始められます</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AABD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
