<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #F8F9FD; box-sizing: border-box; display: flex; flex-direction: column">

<div style="display: flex; flex-direction: column">
<sc-for list="{{above}}" as="item" hint-placeholder-count="2">

<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-size: 16px; font-weight: 600">{{item.name}}</span>
<span style="font-size: 12px; color: #8C8497; flex-shrink: 0">{{item.time}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 14px; color: #8C8497; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.msg}}</span>
<sc-if value="{{item.unread}}" hint-placeholder-val="{{ true }}">
<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #FF758C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">{{item.unread}}</span>
</sc-if>
</div>
</div>

</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8FA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; position: relative" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{below}}" as="item" hint-placeholder-count="5">

<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">

<sc-if value="{{item.unread}}" hint-placeholder-val="{{ false }}">
